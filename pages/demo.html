<title>Hospital Management System</title>
<style>
:root{--p:#0f766e;--p2:#115e59;--bg:#f1f5f9;--bd:#e2e8f0;--tx:#0f172a;--mu:#64748b;--rd:#dc2626;--gn:#16a34a;--am:#d97706}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
button,input,select,textarea{font:inherit}
#app{display:flex;min-height:100vh}
#side{width:220px;background:var(--p2);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;max-height:100vh;flex-shrink:0;min-height:0}
#side .brand{flex:none}#side .who{flex:none}
#side .brand{padding:16px;font-weight:700;font-size:15px;border-bottom:1px solid rgba(255,255,255,.15)}
#side nav{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.35) transparent}
#side nav::-webkit-scrollbar{width:6px}#side nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:3px}
#side nav a{display:block;color:#ccfbf1;text-decoration:none;padding:9px 12px;border-radius:8px;margin-bottom:2px;cursor:pointer}
#side nav a:hover{background:rgba(255,255,255,.1)}#side nav a.on{background:#fff;color:var(--p2);font-weight:600}
#side .who{padding:12px 16px;border-top:1px solid rgba(255,255,255,.15);font-size:12px;color:#99f6e4}
#side .who b{display:block;color:#fff;font-size:13px}
#side .who a{color:#fff;cursor:pointer;text-decoration:underline;margin-right:10px}
#main{flex:1;padding:22px;min-width:0}
.foot{margin-top:30px;font-size:11px;color:var(--mu);text-align:center}
.ph{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.ph h2{margin:0;font-size:20px}.pa{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--p2)}.btn.ghost{background:#fff;color:var(--tx);border:1px solid var(--bd)}
.btn.ghost:hover{background:#f8fafc}.btn.red{background:var(--rd)}.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.panel{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px}
.card .n{font-size:24px;font-weight:700;color:var(--p)}.card .l{color:var(--mu);font-size:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.tw{overflow:auto}table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mu);padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:8px;border-bottom:1px solid #f1f5f9;vertical-align:top}tr:last-child td{border-bottom:0}
.empty{color:var(--mu);padding:18px;text-align:center}
.search,input,select,textarea{border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;background:#fff;color:var(--tx);max-width:100%}
.search{width:100%;max-width:420px;margin-bottom:12px}
input:focus,select:focus,textarea:focus{outline:2px solid #99f6e4;border-color:var(--p)}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:10px}
label input,label select,label textarea{display:block;width:100%;margin-top:3px;color:var(--tx);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:#e2e8f0;color:#334155}
.tag.g{background:#dcfce7;color:#166534}.tag.a{background:#fef3c7;color:#92400e}.tag.r{background:#fee2e2;color:#991b1b}.tag.b{background:#dbeafe;color:#1e40af}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:6px 14px;cursor:pointer}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.ov#picker{z-index:60}
.md{background:#fff;border-radius:14px;width:100%;max-width:560px;padding:18px}.md.wide{max-width:760px}
.md h3{margin:0 0 12px}.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.pp{display:flex;gap:6px;margin-top:3px}.pp input[readonly]{flex:1}
.pi{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;cursor:pointer}.pi:hover{background:#f0fdfa;border-color:var(--p)}
#toast{position:fixed;right:16px;top:16px;z-index:100;display:flex;flex-direction:column;gap:8px}
.t{padding:10px 14px;border-radius:8px;color:#fff;background:#0f172a;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:340px}.t.err{background:var(--rd)}.t.ok{background:var(--gn)}
.banner{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.warn{background:#fee2e2;color:#991b1b;border-radius:8px;padding:6px 10px;font-weight:600;margin-top:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 16px}.kv div span{display:block;font-size:11px;color:var(--mu)}
.wards{display:flex;flex-wrap:wrap;gap:10px}.bed{width:150px;border-radius:10px;padding:10px;border:2px solid #86efac;background:#f0fdf4;cursor:pointer}
.bed.occ{border-color:#fca5a5;background:#fef2f2}.bed small{display:block;color:var(--mu)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#login .box{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:26px;width:100%;max-width:360px}
#login h1{margin:0 0 4px;font-size:20px;color:var(--p2)}#login p{margin:0 0 16px;color:var(--mu)}
#sheet{display:none;position:fixed;inset:0;background:#e2e8f0;overflow:auto;z-index:80;padding:16px}
#sheet .bar{max-width:800px;margin:0 auto 10px;display:flex;gap:8px;justify-content:flex-end}
#sheet .page{background:#fff;max-width:800px;margin:0 auto;padding:30px;min-height:500px}
.lh{text-align:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}.lh h1{margin:0;font-size:22px}.lh div{font-size:12px}
.page h2{text-align:center;margin:8px 0 14px;font-size:16px;text-transform:uppercase;letter-spacing:1px}
.page table th{color:#000;border-bottom:1px solid #000}.page table td{border-bottom:1px solid #ddd}
.sig{margin-top:40px;display:flex;justify-content:space-between}.sig div{border-top:1px solid #000;width:200px;text-align:center;padding-top:4px;font-size:12px}
.r{text-align:right}
.ib{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--bd);background:#fff;border-radius:8px;cursor:pointer;color:#334155;padding:0}
.ib:hover{background:#f0fdfa;border-color:var(--p);color:var(--p2)}.ib.red:hover{background:#fee2e2;border-color:#fca5a5;color:#991b1b}.ib.gn:hover{background:#dcfce7;border-color:#86efac;color:#166534}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acts{display:flex;gap:5px;flex-wrap:nowrap}
.kcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.kc{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;border-left:4px solid var(--p)}.kc .n{font-size:22px;font-weight:700;color:var(--p2);line-height:1.2}.kc .l{color:var(--mu);font-size:12px;margin-top:2px}.kc .s{color:var(--mu);font-size:11px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:16px}
.chart{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px}.chart h4{margin:0 0 8px;font-size:13px;color:#334155}.chart svg{width:100%;height:auto;display:block}
.chart .nodata{color:var(--mu);text-align:center;padding:30px 0;font-size:13px}
.legend{display:flex;flex-direction:column;gap:4px;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.donutwrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.donutwrap svg{width:140px;flex:none}
#burger{display:none;position:fixed;top:10px;left:10px;z-index:70;background:var(--p2);color:#fff;border:0;border-radius:10px;padding:9px 12px;font-size:18px;line-height:1}

async function pVisits(){
  const dopts=await deptOpts('','All departments');
  pg().innerHTML=head('Visits',(can('receptionist','nurse','doctor')?`<button class="btn" onclick="visitPicker()">+ Start visit</button>`:'')+exportButtons('visits','Visits',true))+`<div id="kp"></div><div class="tabs"><button class="on" data-s="Open">Open</button><button data-s="Closed">Closed</button></div><div class="pa" style="margin-bottom:8px"><input class="search" style="margin:0;flex:1;min-width:180px" id="q" placeholder="Search patient"><select id="vown" style="max-width:200px"><option value="">All cases</option><option value="mine"${ME.role==='doctor'?' selected':''}>Assigned to me</option><option value="none">Not yet assigned</option></select><select id="vdept" style="max-width:220px">${dopts}</select></div><div class="panel" id="vl"></div>`;
  pageKpis('visits');
  let st='Open',t;
  const load=()=>run(async()=>{const q=`status=${st}&q=${encodeURIComponent(v('q'))}${v('vown')==='mine'?'&mine=1':''}${v('vown')==='none'?'&unassigned=1':''}${v('vdept')?'&department_id='+v('vdept'):''}`;const l=await api('visits?'+q);window._vis=l;
    $('#vl').innerHTML=tableWrap(table([{h:'Date',f:r=>dt(r.created)},{h:'Patient',f:r=>esc(r.pname)+' <span class="tag">'+esc(r.pid)+'</span>'},{h:'Complaint',f:r=>esc(r.complaint)},{h:'Assigned doctor',f:r=>esc(r.dname||'Not assigned')},{h:'Department',f:r=>esc(r.dept||'Not set')},{h:'Nurse',f:r=>esc(r.nname||'Not assigned')},{h:'Status',f:r=>tag(r.status)},
      {h:'Actions',f:r=>acts(can('doctor','nurse')?ib('eye','Open case',`location.hash='#visit/${r.id}'`):'',can('doctor','nurse')?ib('print','Print visit summary',`visitSheet(${r.id})`):'',r.status==='Open'&&can('receptionist','nurse','doctor')?ib('transfer','Assign or transfer case',`caseAssignRow(${r.id})`,'gn'):'',can('receptionist','cashier')?ib('coin','Create invoice for this visit',`billVisit(${r.id})`,'gn'):'')}],l,'No cases match these filters'))});
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{st=b.dataset.s;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));load()});
  ['vown','vdept'].forEach(i=>$('#'+i).onchange=load);
  $('#q').oninput=()=>{clearTimeout(t);t=setTimeout(load,200)};load();
}
function caseAssignRow(id){const r=(window._vis||[]).find(x=>x.id===id)||{};caseAssign(id,{doctor_id:r.doctor_id||null,department_id:r.department_id||null})}
function caseAssign(id,cur){run(async()=>{const docs=await api('doctors');const dopts=await deptOpts(cur.department_id,'Not set');
  modal('Assign patient case',`<p style="font-size:13px;margin:0 0 8px">Choose the doctor responsible for this case and the department it belongs to. The doctor is notified. A doctor can hand a case over to another doctor; after that only the new doctor, the receptionist or the administrator can change it.</p>`+
  fld('ca_d','Responsible doctor',cur.doctor_id||'',null,[['','Not assigned (any doctor)']].concat(docs.map(x=>[x.id,x.name])))+
  `<label>Department<select id="ca_dept">${dopts}</select></label>`+fld('ca_n','Reason for the change (kept in the history)','','textarea'),

function visitPicker(){modal('Start visit',ppField('vp_p'),async()=>{if(!v('vp_p'))throw new Error('Select a patient');const pid=v('vp_p');window._pn=window._pn||{};window._pn[pid]=$('#vp_p_n').value;closeModal();newVisit(pid)},'Next')}
function billVisit(id){run(async()=>{const r=await api('invoices/from-visit',{visit_id:id});location.hash='#invoice/'+r.id})}

async function pVisit(id){
  const d=await api('visits/get?id='+id),vs=d.visit,p=d.patient,open=vs.status==='Open';
  const mineOk=!(ME.role==='doctor'&&vs.doctor_id&&vs.doctor_id!==ME.id);
  const cv=open&&can('nurse','doctor')&&mineOk,cc=open&&can('doctor')&&mineOk;
  let h=head('Visit: '+esc(p.name)+' '+tag(vs.status),`<button class="btn ghost" onclick="rxSheet(${vs.id})">Print prescription</button>${open&&can('admin','doctor','nurse','receptionist')?`<button class="btn ghost" onclick="caseAssign(${vs.id},{doctor_id:${vs.doctor_id||'null'},department_id:${vs.department_id||'null'}})">Assign or transfer</button>`:''}<button class="btn ghost" onclick="visitSheet(${vs.id})">Print summary</button>${can('receptionist','cashier')?`<button class="btn ghost" onclick="billVisit(${vs.id})">Create invoice</button>`:''}${open&&can('doctor')&&mineOk?`<button class="btn red" onclick="closeVisit(${vs.id})">Close visit</button>`:''}`);
  if(!mineOk)h+='<div class="warn">This case is assigned to another doctor. You can see it, but only the assigned doctor can change it. Ask the receptionist to reassign it if needed.</div>';
  h+=`<div class="panel">${kv([['Patient',`<a href="#patient/${p.id}">${esc(p.name)}</a> (${esc(p.pid)})`],['Gender / Age',esc(p.gender)+' / '+age(p.dob)],['Doctor',esc(d.doctor)||'Not assigned'],['Department',esc(d.department)||'Not set'],['Nurse',esc(d.nurse)||'Not assigned'],['Started',dt(vs.created)]])}${p.allergies?`<div class="warn">Allergies: ${esc(p.allergies)}</div>`:''}</div>`;
  h+=`<div class="panel"><h3>Vital signs</h3><div class="grid3">${fld('vb','Blood pressure (e.g. 120/80)',vs.bp)}${fld('vt','Temperature (&deg;C)',vs.temp)}${fld('vp','Pulse (bpm)',vs.pulse)}${fld('vr','Respiration (/min)',vs.resp)}${fld('vw','Weight (kg)',vs.weight)}${fld('vs','SpO2 (%)',vs.spo2)}</div>${cv?`<button class="btn" onclick="saveVitals(${vs.id})">Save vitals</button>`:''}</div>`;
  h+=`<div class="panel"><h3>Consultation</h3>${fld('cc','Presenting complaint',vs.complaint,'textarea')}${fld('cn','Examination / notes',vs.notes,'textarea')}${fld('cd','Diagnosis',vs.diagnosis)}${fld('cp','Treatment plan',vs.plan,'textarea')}${cc?`<button class="btn" onclick="saveConsult(${vs.id})">Save consultation</button>`:''}</div>`;
  h+=`<div class="panel"><h3>Laboratory</h3><div id="labbox"></div></div><div class="panel"><h3>Prescription</h3><div id="rxbox"></div></div>`;
  h+=`<div class="panel"><h3>Case assignment history</h3>${tableWrap(table([{h:'When',f:r=>dt(r.at)},{h:'Doctor',f:r=>esc(r.doctor||'Not assigned')},{h:'Department',f:r=>esc(r.dept||'Not set')},{h:'By',f:r=>esc(r.by_name||'')},{h:'Note',f:r=>esc(r.note||'')}],d.history||[],'No changes yet'))}</div>`;
  pg().innerHTML=h;
  if(!cv)document.querySelectorAll('#vb,#vt,#vp,#vr,#vw,#vs').forEach(e=>e.disabled=true);
  if(!cc)document.querySelectorAll('#cc,#cn,#cd,#cp').forEach(e=>e.disabled=true);
  window._vc={id:vs.id,cc};drawParts(d);
  if(cc){const[t,dr]=await Promise.all([api('lab/tests'),api('drugs')]);window._vc.tests=t;window._vc.drugs=dr;drawParts(d)}
}
function drawParts(d){
  const cc=window._vc.cc,t=window._vc.tests||[],dr=window._vc.drugs||[];
  $('#labbox').innerHTML=table([{h:'Test',f:r=>esc(r.test_name)},{h:'Status',f:r=>tag(r.status)},{h:'Result',f:r=>esc(r.result||'-')},{h:'',f:r=>cc&&r.status==='Pending'?ib('trash','Remove test',`partDo('lab-remove',${r.id})`,'red'):''}],d.labs,'No tests ordered')+(cc?`<div class="pp" style="margin-top:10px"><select id="lt" style="flex:1">${t.map(x=>`<option value="${x.id}">${esc(x.name)} (${fmt(x.price)})</option>`).join('')}</select><button class="btn" onclick="orderLab()">Order test</button></div>`:'');
  $('#rxbox').innerHTML=table([{h:'Drug',f:r=>esc(r.drug_name)},{h:'Dose',f:r=>esc(r.dose)},{h:'Frequency',f:r=>esc(r.frequency)},{h:'Duration',f:r=>esc(r.duration)},{h:'Qty',f:r=>r.qty},{h:'Status',f:r=>r.dispensed?tag('Done'):tag('Pending')},{h:'',f:r=>cc&&!r.dispensed?ib('trash','Remove item',`partDo('rx-remove',${r.id})`,'red'):''}],d.rx,'Nothing prescribed')+(cc?`<div style="margin-top:10px"><div class="grid2">${fld('rd','Drug','',null,dr.map(x=>[x.id,x.name+' '+(x.strength||'')+' '+(x.form||'')+' (stock '+x.stock+')']))}${fld('rq','Quantity to dispense','1','number')}${fld('rdo','Dose (e.g. 1 tablet)','')}${fld('rf','Frequency (e.g. 3 times daily)','')}${fld('rdu','Duration (e.g. 5 days)','')}</div><button class="btn" onclick="addRx()">Add to prescription</button></div>`:'');
}

function addRx(){run(async()=>{await api('visits/rx-add',{visit_id:window._vc.id,drug_id:v('rd'),dose:v('rdo'),frequency:v('rf'),duration:v('rdu'),qty:v('rq')});refreshParts()})}

  sheet(`<h2>Visit Summary</h2>${kv([['Patient',esc(p.name)+' ('+esc(p.pid)+')'],['Gender / Age',esc(p.gender)+' / '+age(p.dob)],['Date',dt(s.created)],['Doctor',esc(d.doctor)],['Allergies',esc(p.allergies)||'None recorded']])}<h3>Vitals</h3>${kv([['BP',esc(s.bp)],['Temp',esc(s.temp)],['Pulse',esc(s.pulse)],['Resp',esc(s.resp)],['Weight',esc(s.weight)],['SpO2',esc(s.spo2)]])}<h3>Consultation</h3><p><b>Complaint:</b> ${esc(s.complaint)}</p><p><b>Notes:</b> ${esc(s.notes).replace(/\n/g,'<br>')}</p><p><b>Diagnosis:</b> ${esc(s.diagnosis)}</p><p><b>Plan:</b> ${esc(s.plan).replace(/\n/g,'<br>')}</p><h3>Lab</h3>${table([{h:'Test',f:r=>esc(r.test_name)},{h:'Result',f:r=>esc(r.result||'Pending')}],d.labs,'None')}<h3>Prescription</h3>${table([{h:'Drug',f:r=>esc(r.drug_name)},{h:'Dose',f:r=>esc(r.dose+', '+r.frequency+', '+(r.duration||''))},{h:'Qty',f:r=>r.qty}],d.rx,'None')}<div class="sig"><div>Doctor's signature</div></div>`)})}

/* ---------- billing ---------- */
async function pBilling(){
  pg().innerHTML=head('Billing',`<button class="btn ghost" onclick="hmoManager()">HMO / Insurance</button><button class="btn" onclick="invForm()">+ New invoice</button>`+exportButtons('invoices','Invoices',true)+exportButtons('payments','Payments',true))+`<div id="kp"></div><div class="pa" style="margin-bottom:10px"><input class="search" style="margin:0" id="q" placeholder="Search patient, ID or invoice no."><select id="st"><option value="">All</option><option>Unpaid</option><option>Part</option><option>Paid</option><option>Void</option></select></div><div class="panel" id="il"></div>`;pageKpis('billing');
  let t;const load=()=>run(async()=>{const l=await api(`invoices?status=${v('st')}&q=${encodeURIComponent(v('q'))}`);
    $('#il').innerHTML=table([{h:'No.',f:r=>`<a href="#invoice/${r.id}">${esc(r.no)}</a>`},{h:'Date',f:r=>dt(r.created)},{h:'Patient',f:r=>esc(r.pname)+' <span class="tag">'+esc(r.pid)+'</span>'},{h:'Total',f:r=>fmt(r.total)},{h:'Paid',f:r=>fmt(r.paid)},{h:'Balance',f:r=>fmt(r.status==='Void'?0:r.total-r.hmo_share-r.paid)},{h:'Status',f:r=>tag(r.status)},{h:'Actions',f:r=>{const bal=Math.round((r.total-r.hmo_share-r.paid)*100)/100;return acts(ib('eye','Open invoice',`location.hash='#invoice/${r.id}'`),ib('print','Print invoice',`invPrint(${r.id})`),r.status==='Unpaid'||r.status==='Part'?ib('coin','Receive payment',`payForm(${r.id},${bal})`,'gn'):'',can()&&r.status==='Unpaid'?ib('x','Void invoice',`voidInvList(${r.id})`,'red'):'')}}],l,'No invoices')});
  $('#q').oninput=()=>{clearTimeout(t);t=setTimeout(load,200)};$('#st').onchange=load;load();
}
function itemRow(){return `<div class="grid3 ir" style="grid-template-columns:3fr 1fr 1fr"><input placeholder="Description" class="id"><input type="number" min="0.01" step="any" value="1" class="iq"><input type="number" min="0" step="any" placeholder="Price" class="ip"></div>`}
function invForm(){modal('New invoice',ppField('i_p')+`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="i_sp" style="width:auto;margin:0"> Self-pay (ignore the patient's HMO cover)</label>`+`<div id="irs">${itemRow()}</div><button class="btn sm ghost" onclick="$('#irs').insertAdjacentHTML('beforeend',itemRow())">+ Add line</button>`,async()=>{
  const items=[...document.querySelectorAll('.ir')].map(r=>({description:r.querySelector('.id').value,qty:r.querySelector('.iq').value,price:r.querySelector('.ip').value})).filter(i=>i.description.trim()||i.price);
  const r=await api('invoices/new',{patient_id:v('i_p'),items,self_pay:$('#i_sp').checked});closeModal();location.hash='#invoice/'+r.id},'Create',true)}
async function pInvoice(id){
  const d=await api('invoices/get?id='+id),i=d.invoice,p=d.patient,bal=Math.round((i.total-i.hmo_share-i.paid)*100)/100,live=i.status!=='Void'&&i.status!=='Paid';
  let h=head('Invoice '+esc(i.no)+' '+tag(i.status),`<button class="btn ghost" onclick="invSheet(${i.id})">Print</button>${i.status!=='Void'&&can()&&!i.paid?`<button class="btn red" onclick="voidInv(${i.id})">Void</button>`:''}${live?`<button class="btn ghost" onclick="addItem(${i.id})">+ Add item</button><button class="btn" onclick="payForm(${i.id},${bal})">Receive payment</button>`:''}`);
  h+=`<div class="panel">${kv([['Patient',`<a href="#patient/${p.id}">${esc(p.name)}</a> (${esc(p.pid)})`],['Date',dt(i.created)],['Total',fmt(i.total)],['HMO covers',i.hmo_share>0?fmt(i.hmo_share)+' ('+esc(d.hmo?d.hmo.name:'')+(i.hmo_settled_at?', settled':', unsettled')+')':'-'],['Patient pays',fmt(i.total-i.hmo_share)],['Paid',fmt(i.paid)],['Balance',fmt(i.status==='Void'?0:bal)]])}</div>`;
  h+=`<div class="panel"><h3>Items</h3>${table([{h:'Description',f:r=>esc(r.description)},{h:'Qty',f:r=>r.qty},{h:'Price',f:r=>fmt(r.price)},{h:'Amount',f:r=>fmt(r.qty*r.price)}],d.items)}</div><div class="panel"><h3>Payments</h3>${table([{h:'Receipt',f:r=>'RCP-'+String(r.id).padStart(6,'0')},{h:'Date',f:r=>dt(r.created)},{h:'Method',f:r=>esc(r.method)},{h:'Amount',f:r=>fmt(r.amount)},{h:'Received by',f:r=>esc(r.rname||'')}],d.payments,'No payments yet')}</div>`;
  pg().innerHTML=h;window._inv=d;
}
function payForm(id,bal){modal('Receive payment',`<p>Balance: <b>${fmt(bal)}</b></p>`+fld('pa','Amount',bal,'number')+fld('pm','Method','Cash',null,['Cash','POS','Transfer','Other']),async()=>{await api('invoices/pay',{invoice_id:id,amount:v('pa'),method:v('pm')});closeModal();toast('Payment recorded','ok');if(location.hash.startsWith('#invoice'))render();else pBilling()},'Record payment')}
function addItem(id){modal('Add item',fld('ad','Description','')+`<div class="grid2">${fld('aq','Quantity','1','number')}${fld('ap','Price','','number')}</div>`,async()=>{await api('invoices/add-item',{invoice_id:id,description:v('ad'),qty:v('aq'),price:v('ap')});closeModal();render()},'Add')}
function invPrint(id){run(async()=>{window._inv=await api('invoices/get?id='+id);invSheet()})}
function voidInvList(id){if(confirm('Void this invoice? This cannot be undone.'))run(async()=>{await api('invoices/void',{id});toast('Invoice voided','ok');pBilling()})}
function voidInv(id){if(confirm('Void this invoice? This cannot be undone.'))run(async()=>{await api('invoices/void',{id});render()})}
function invSheet(){const d=window._inv,i=d.invoice,p=d.patient;
  sheet(`<h2>${i.status==='Paid'?'Receipt':'Invoice'}</h2>${kv([['Invoice no.',esc(i.no)],['Date',dt(i.created)],['Patient',esc(p.name)+' ('+esc(p.pid)+')'],['Status',esc(i.status)]])}<br>${table([{h:'Description',f:r=>esc(r.description)},{h:'Qty',f:r=>r.qty},{h:'Price',f:r=>fmt(r.price)},{h:'Amount',f:r=>fmt(r.qty*r.price)}],d.items)}<p class="r"><b>Total: ${fmt(i.total)}</b><br>${i.hmo_share>0?'HMO ('+esc(d.hmo?d.hmo.name:'')+') covers: '+fmt(i.hmo_share)+'<br>Patient pays: '+fmt(i.total-i.hmo_share)+'<br>':''}Paid: ${fmt(i.paid)}<br><b>Balance: ${fmt(i.status==='Void'?0:i.total-i.hmo_share-i.paid)}</b></p>${d.payments.length?'<h3>Payments</h3>'+table([{h:'Receipt',f:r=>'RCP-'+String(r.id).padStart(6,'0')},{h:'Date',f:r=>dt(r.created)},{h:'Method',f:r=>esc(r.method)},{h:'Amount',f:r=>fmt(r.amount)}],d.payments):''}${SET.invoice_terms?'<p style="font-size:11px;color:#444;white-space:pre-wrap;margin-top:18px">'+esc(SET.invoice_terms)+'</p>':''}<div class="sig"><div>Cashier</div></div>`)}


function hmoManager(){run(async()=>{const l=await api('hmos/summary');window._hmos=l;
  modal('HMO / Insurance',table([{h:'HMO',f:r=>esc(r.name)},{h:'Covers',f:r=>r.coverage+'%'},{h:'Unsettled claims',f:r=>r.pending_n+' invoice(s) / '+fmt(r.pending_amount)},{h:'Actions',f:r=>acts(ib('print','Print claim statement',`hmoStatement(${r.id})`),r.pending_n?ib('check','Mark claims settled',`hmoSettle(${r.id})`,'gn'):'',ib('edit','Edit HMO',`hmoForm(${r.id})`),can()?ib('trash','Remove HMO',`hmoDel(${r.id})`,'red'):'')}],l,'No HMOs added yet')+`<button class="btn" onclick="hmoForm()">+ Add HMO</button>`,null,null,true)})}
function hmoForm(id){const h=(window._hmos||[]).find(x=>x.id===id)||{coverage:100};modal(id?'Edit HMO':'Add HMO',fld('hn','HMO name',h.name)+fld('hc','Percentage of the bill the HMO pays',h.coverage,'number'),async()=>{await api('hmos/save',{id,name:v('hn'),coverage:v('hc')});toast('Saved','ok');hmoManager()})}
function hmoDel(id){if(confirm('Remove this HMO? Patients linked to it become self-pay.'))run(async()=>{await api('hmos/delete',{id});hmoManager()})}
function hmoSettle(id){if(confirm('Mark all unsettled claims for this HMO as paid by the HMO?'))run(async()=>{const r=await api('hmos/settle',{id});toast(r.settled+' claim(s) settled','ok');hmoManager()})}
function hmoStatement(id){run(async()=>{const h=await api('hmos/claims?id='+id);const tot=h.claims.reduce((a,x)=>a+x.hmo_share,0);
  sheet(`<h2>HMO Claim Statement</h2><p style="text-align:center"><b>${esc(h.name)}</b> (covers ${h.coverage}%)<br>Printed ${esc(todayStr())}</p>${table([{h:'Invoice',f:x=>esc(x.no)},{h:'Date',f:x=>dt(x.created)},{h:'Patient',f:x=>esc(x.pname)+' ('+esc(x.pid)+')'},{h:'Member no.',f:x=>esc(x.member_no)},{h:'Bill',f:x=>fmt(x.total)},{h:'Claim',f:x=>fmt(x.hmo_share)}],h.claims,'No unsettled claims')}<p class="r"><b>Total claim: ${fmt(tot)}</b></p><div class="sig"><div>Prepared by</div><div>HMO officer</div></div>`)})}
async function dl(path,name){const r=await fetch('/api/'+path);if(!r.ok){let m='Download failed';try{m=(await r.json()).error}catch(e){}toast(m,'err');return}
  const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
const exportCsv=(what,from,to)=>dl(`export?what=${what}&from=${from||''}&to=${to||''}`,what+'_'+todayStr()+'.csv');
async function pAudit(){
  pg().innerHTML=head('Audit log',exportButtons('audit','Audit log',true))+`<input class="search" id="q" placeholder="Filter by user, action or detail"><div class="panel" id="au"></div>`;
  let t;const load=()=>run(async()=>{const l=await api('audit?q='+encodeURIComponent(v('q')));$('#au').innerHTML=table([{h:'When',f:r=>dt(r.at)},{h:'User',f:r=>esc(r.username)},{h:'Action',f:r=>esc(r.action)},{h:'Detail',f:r=>esc(r.detail)},{h:'Actions',f:r=>acts(ib('eye','View entry',`viewItem('Audit entry',${JSON.stringify([['When',r.at],['User',r.username],['Action',r.action],['Detail',r.detail]]).replace(/"/g,'&quot;')})`))}],l,'Nothing logged')});
  $('#q').oninput=()=>{clearTimeout(t);t=setTimeout(load,200)};load();
}
const notesHtml=l=>table([{h:'When',f:r=>dt(r.created)},{h:'Type',f:r=>`<span class="tag ${r.kind==='Medication'?'b':''}">${esc(r.kind)}</span>`},{h:'Entry',f:r=>esc(r.note)},{h:'By',f:r=>esc(r.by_name||'')}],l,'No entries yet');

/* ---------- reports ---------- */
async function pReports(){
  pg().innerHTML=head('Reports','<button class="btn ghost" onclick="repSheet()">Print</button><button class="btn ghost" onclick="exportCsv(\'payments\',v(\'rf\'),v(\'rt\'))">Export payments</button><button class="btn ghost" onclick="exportCsv(\'invoices\',v(\'rf\'),v(\'rt\'))">Export invoices</button>'+(can()?'<button class="btn ghost" onclick="exportCsv(\'patients\')">Export patients</button>':''))+`<div class="panel"><div class="grid3" style="max-width:520px">${fld('rf','From',todayStr(),'date')}${fld('rt','To',todayStr(),'date')}<label>&nbsp;<button class="btn" style="margin-top:3px;width:100%" onclick="loadRep()">Show</button></label></div></div><div id="rep"></div>`;loadRep();
}
function loadRep(){run(async()=>{const r=await api(`reports?from=${v('rf')}&to=${v('rt')}`);window._rep=r;
  const c=[['Collected',fmt(r.collected)],['Billed',fmt(r.billed)],['Outstanding (all time)',fmt(r.outstanding)],['New patients',r.registrations],['Visits',r.visits],['Admissions',r.admissions],['Discharges',r.discharges],['Lab tests done',r.labs_done],['Items dispensed',r.dispensed],['HMO claims unsettled',fmt(r.hmo_receivable)],['HMO claims settled',fmt(r.hmo_settled)]];
  $('#rep').innerHTML=repCharts(r)+`<div class="cards">${c.map(x=>`<div class="card"><div class="n">${x[1]}</div><div class="l">${x[0]}</div></div>`).join('')}</div><div class="two"><div class="panel"><h3>Collections by method</h3>${table([{h:'Method',f:x=>esc(x.method)},{h:'Payments',f:x=>x.n},{h:'Amount',f:x=>fmt(x.amount)}],r.by_method,'No payments')}</div><div class="panel"><h3>Top diagnoses</h3>${table([{h:'Diagnosis',f:x=>esc(x.diagnosis)},{h:'Cases',f:x=>x.n}],r.top_dx,'No diagnoses')}</div></div><div class="panel"><h3>Daily collections</h3>${table([{h:'Date',f:x=>esc(x.day)},{h:'Amount',f:x=>fmt(x.amount)}],r.daily,'No payments')}</div>`})}
function repCharts(r){return `<div class="charts">${chartHtml({title:'Money collected per day',type:'bar',labels:r.daily.map(x=>x.day),values:r.daily.map(x=>x.amount),money:true,dates:true})}${chartHtml({title:'Collections by method',type:'donut',labels:r.by_method.map(x=>x.method),values:r.by_method.map(x=>x.amount),money:true})}${chartHtml({title:'Top diagnoses',type:'hbar',labels:r.top_dx.map(x=>x.diagnosis),values:r.top_dx.map(x=>x.n)})}</div>`}
function repSheet(){const r=window._rep;if(!r)return;sheet(`<h2>Summary Report</h2><p style="text-align:center">${esc(r.from)} to ${esc(r.to)}</p>${table([{h:'Item',f:x=>x[0]},{h:'Value',f:x=>x[1]}],[['Collected',fmt(r.collected)],['Billed',fmt(r.billed)],['Outstanding (all time)',fmt(r.outstanding)],['HMO claims unsettled',fmt(r.hmo_receivable)],['HMO claims settled',fmt(r.hmo_settled)],['New patients',r.registrations],['Visits',r.visits],['Admissions',r.admissions],['Discharges',r.discharges],['Lab tests done',r.labs_done],['Items dispensed',r.dispensed]])}<h3>Collections by method</h3>${table([{h:'Method',f:x=>esc(x.method)},{h:'Amount',f:x=>fmt(x.amount)}],r.by_method,'None')}<h3>Top diagnoses</h3>${table([{h:'Diagnosis',f:x=>esc(x.diagnosis)},{h:'Cases',f:x=>x.n}],r.top_dx,'None')}`)}

/* ---------- shared helpers for the new modules ---------- */
const fmtN=(v)=>Number(v||0).toLocaleString();
const pill=(s)=>{const m={Verified:'g',Approved:'g','Partially approved':'a',Pending:'a',Requested:'a',Rejected:'r',Declined:'r',Expired:'r','Not verified':'',Paid:'g',Submitted:'b','Part-paid':'a',Draft:'',Reported:'g','Under investigation':'a','Action required':'r',Resolved:'g',Closed:'',Reported2:'',Final:'g',Superseded:'',Critical:'r',Major:'r',Moderate:'a',Minor:'b','Near miss':'',Active:'g',Suspended:'r'};return `<span class="tag ${m[s]||''}">${esc(s||'')}</span>`};
const selOpts=(arr,cur)=>arr.map(x=>`<option value="${esc(x)}"${String(x)===String(cur)?' selected':''}>${esc(x)}</option>`).join('');
const deptOpts=async(cur,blank)=>{const l=await api('departments');return [`<option value="">${blank||'Not set'}</option>`].concat(l.map(d=>`<option value="${d.id}"${String(d.id)===String(cur||'')?' selected':''}>${esc(d.name)}</option>`)).join('')};
function tableWrap(html){return `<div class="tbl-wrap">${html}</div>`}
/* open a dialog for a CSV or export button */
function exportButtons(what,title,dated){return `<button class="btn ghost sm" onclick="exportPick('${what}','${esc(title)}',${dated?1:0})">${ic('export')} Export</button>`}
const ic=(n,t)=>`<svg viewBox="0 0 24 24" style="width:16px;height:16px;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">${NAVICON[n]||IC[n]||''}</svg>`;
async function exportPick(what,title,dated){
  const info=await api('export/list');
  modal('Export: '+title,`<p style="font-size:13px;margin:0 0 10px">Choose the file type. Excel and PDF open in any office program.</p><div class="pa" style="margin-bottom:12px">${['csv','xlsx','json','pdf','html'].map(f=>`<button class="btn ghost" onclick="doExport('${what}','${f}')">${f==='csv'?'CSV (Excel)':f==='xlsx'?'Excel (.xlsx)':f.toUpperCase()}</button>`).join('')}</div>${dated?`<div class="grid2"><label>From<input type="date" id="ex_f" value="${todayStr()}"></label><label>To<input type="date" id="ex_t" value="${todayStr()}"></label></div><p style="font-size:12px;color:#64748b">Leave the dates as they are to export today only, or change them for a longer period.</p>`:''}`,null);
}
function doExport(what,fmt){const f=document.getElementById('ex_f')?v('ex_f'):'',t=document.getElementById('ex_t')?v('ex_t'):'';
  run(async()=>{const r=await fetch(`/api/export?what=${what}&format=${fmt}&from=${f}&to=${t}`);if(!r.ok){let m='Export failed';try{m=(await r.json()).error}catch(e){}toast(m,'err');return}
    const ext={csv:'csv',xlsx:'xlsx',json:'json',pdf:'pdf',html:'html'}[fmt];const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=what+'_'+todayStr()+'.'+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);closeModal();toast('Exported','ok')})}
/* export whatever table is on screen (used by the report centre) */
function exportTable(title,cols,rows_){window._exp={title,cols,rows:rows_};modal('Export this table',`<p style="font-size:13px">Exports exactly what you see: ${rows_.length} rows.</p><div class="pa">${['csv','xlsx','json','pdf','html'].map(f=>`<button class="btn ghost" onclick="doTableExport('${f}')">${f==='csv'?'CSV (Excel)':f==='xlsx'?'Excel (.xlsx)':f.toUpperCase()}</button>`).join('')}</div>`,null)}
function doTableExport(fmt){const e=window._exp;run(async()=>{const r=await fetch('/api/export/table',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:e.title,columns:e.cols.map(c=>c.h),rows:e.rows,format:fmt})});if(!r.ok){toast('Export failed',"err");return}
  const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(e.title||'report').replace(/[^A-Za-z0-9_-]+/g,'_')+'_'+todayStr()+'.'+fmt;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);closeModal();toast('Exported','ok')})}


/* ---------- departments and units ---------- */
async function pDepartments(){
  const l=await api('departments');window._deps=l;const adm=can();
  const byKind=['Clinical','Diagnostic','Support','Administrative'].map(k=>[k,l.filter(d=>d.kind===k)]);
  let h=head('Departments and units',(adm?`<button class="btn" onclick="deptForm()">${ic('plus')} Add department</button>`:'')+(adm?`<button class="btn ghost" onclick="importForm2('departments')">Import CSV</button>`:'')+exportButtons('departments','Departments and units',false));
  h+=`<div id="kp"></div>`;
  h+=byKind.filter(x=>x[1].length).map(([k,items])=>`<div class="panel"><h3>${k}</h3><div class="ph-cards">${items.map(d=>`<div class="pq-card" style="flex-direction:column;align-items:stretch;gap:6px"><div style="display:flex;justify-content:space-between;gap:6px"><b>${esc(d.name)}</b><span class="tag">${esc(d.code||'')}</span></div><div style="font-size:12px;color:#64748b">${esc(d.location||'')}${d.phone?' &middot; ext '+esc(d.phone):''}</div><div style="font-size:12px">Head: <b>${esc(d.head||'not set')}</b></div><div style="display:flex;gap:10px;flex-wrap:wrap;font-size:12px"><span>${d.staff} staff</span><span>${d.open_visits} open visits</span><span>${d.visits_30d} visits (30 days)</span><span>${d.admitted} admitted</span>${d.incidents_open?`<span style="color:#b91c1c">${d.incidents_open} open incidents</span>`:''}${d.billed_30d!==null?`<span>${fmt(d.billed_30d)} billed</span>`:''}</div>${adm?`<div class="acts" style="margin-top:4px">${ib('edit','Edit department',`deptForm(${d.id})`)}${ib('trash','Remove department',`deptDel(${d.id})`,'red')}</div>`:''}</div>`).join('')}</div></div>`).join('');
  pg().innerHTML=h;pageKpis('departments');
}

  modal('New document',fld('dn_k','Type of document',kinds[0],null,kinds.map(k=>[k,DOC_LABEL[k]]))+`<p style="font-size:13px">After you choose the type you will pick the visit, admission or study. The document is filled in automatically from the record, and you can then check and edit it before you finalise it.</p>`,
   async()=>{const k=v('dn_k');closeModal();docPickSource(k)},'Next')})}
function docPickSource(kind){run(async()=>{
  if(kind==='discharge'){const a=await api('admissions');if(!a.length)return toast('No patients are admitted right now. Admissions appear here.','err');
    modal('Discharge summary: choose the admission',fld('dsrc','Admitted patient',a[0].id,null,a.map(x=>[x.id,x.pname+' ('+x.pid+') - '+x.ward_name+', '+x.bed_label]))+`<p style="font-size:12px;color:#64748b">Works for patients admitted now or already discharged: pick from the Wards page or the patient profile.</p>`,async()=>{const r=await api('documents/generate',{kind,admission_id:v('dsrc')});closeModal();location.hash='#document/'+r.id},'Create draft')}
  else if(kind==='radiology'){const o=await api('imaging/orders?status=Reported');if(!o.length)return toast('No reported imaging studies yet','err');
    modal('Radiology report: choose the study',fld('dsrc','Reported study',o[0].id,null,o.map(x=>[x.id,x.pname+' - '+x.test_name+' ('+x.pid+')'])),async()=>{const r=await api('documents/generate',{kind,ref_id:v('dsrc')});closeModal();location.hash='#document/'+r.id},'Create draft')}
  else{const vs=await api('visits');if(!vs.length)return toast('No visits yet','err');
    modal(DOC_LABEL[kind]+': choose the visit',fld('dsrc','Visit',vs[0].id,null,vs.map(x=>[x.id,x.pname+' ('+x.pid+') - '+dt(x.created).slice(0,10)+' - '+(x.complaint||'')])),async()=>{const r=await api('documents/generate',{kind,visit_id:v('dsrc')});closeModal();location.hash='#document/'+r.id},'Create draft')}})}

async function pDocument(id){
  const d=await api('documents/get?id='+id);const sch=window._dsch||await api('documents/schema');window._dsch=sch;
  const p=d.patient||{};const fields=d.sections.flatMap(s=>s.fields);const editable=d.can_edit;
  const sectionsHtml=d.sections.map(sec=>`<h3 style="font-size:14px;margin:14px 0 6px;color:#115e59;border-bottom:1px solid #e2e8f0;padding-bottom:4px">${esc(sec.title)}</h3>`+sec.fields.map(f=>{const val=d.data[f.k]||'';const ro=!editable;
     if(f.t==='select')return `<label>${esc(f.l)}${f.req?' *':''}<select id="df_${f.k}" ${ro?'disabled':''}><option value=""></option>${selOpts(f.opts,val)}</select></label>`;
     if(f.t==='textarea')return `<label>${esc(f.l)}${f.req?' *':''}<textarea id="df_${f.k}" rows="${Math.max(2,Math.min(8,Math.ceil(String(val).length/80)+1))}" ${ro?'disabled':''}>${esc(val)}</textarea></label>`;
     if(f.t==='date')return `<label>${esc(f.l)}${f.req?' *':''}<input type="date" id="df_${f.k}" value="${esc(val)}" ${ro?'disabled':''}></label>`;
     return `<label>${esc(f.l)}${f.req?' *':''}<input id="df_${f.k}" value="${esc(val)}" ${ro?'disabled':''}></label>`}).join('')).join('');
  const collect=()=>{const o={};fields.forEach(f=>{const el=document.getElementById('df_'+f.k);if(el)o[f.k]=el.value});return o};
  const bar=`<div class="pa" style="margin-bottom:10px"><button class="btn ghost" onclick="location.hash='#documents'">Back</button>${editable?`<button class="btn ghost" onclick="docSave(${d.id})">Save draft</button><button class="btn" onclick="docFinal(${d.id})">Finalise document</button>`:''}${d.can_amend?`<button class="btn ghost" onclick="docAmend(${d.id})">Amend (make a corrected copy)</button>`:''}${d.status==='Draft'&&editable?`<button class="btn ghost" onclick="docDel(${d.id})">Delete draft</button>`:''}<button class="btn" onclick="window.print()">Print or save as PDF</button></div>`;
  const status=d.status==='Final'?`<span class="tag g">Final, signed ${esc((d.finalizer||{}).name||'')} on ${esc((d.finalized_at||'').slice(0,10))}</span>`:d.status==='Superseded'?'<span class="tag">Superseded by a later amendment</span>':'<span class="tag a">Draft, not yet final</span>';
  const pdoc=`<div class="docpaper"><div class="lh"><h1>${esc(SET.hospital_name)}</h1><div>${esc(SET.address||'')}</div><div>${esc([SET.phone,SET.email].filter(Boolean).join(' | '))}</div></div><h2 style="text-align:center;text-transform:uppercase;letter-spacing:1px;font-size:16px;margin:10px 0">${esc(DOC_LABEL[d.kind])}</h2>
   <div class="kv" style="margin-bottom:8px">${[['Document no.',esc(d.no)],['Date',esc((d.created||'').slice(0,10))],['Patient',esc(p.name||'')],['Patient ID',esc(p.pid||'')],['Gender / age',esc((p.gender||'')+' / '+(p.dob?age(p.dob)+' years':''))],['Blood group',esc(p.blood_group||'-')],['Allergies',esc(p.allergies||'None recorded')],['Status',status]].map(x=>`<div><span>${x[0]}</span>${x[1]}</div>`).join('')}</div>
   ${sectionsHtml}<p style="font-size:11px;color:#64748b;margin-top:18px">Prepared by ${esc(d.author.name||'')} (${esc(d.author.role||'')}). ${d.status==='Final'?'This document is final and cannot be changed. Amendments are kept as new numbered copies.':''}</p>
   <div class="sig"><div>Signature and stamp</div><div>Date</div></div></div>`;
  pg().innerHTML=bar+`<div class="panel docpanel"><div class="pa" style="justify-content:space-between;margin-bottom:6px"><h2 style="font-size:16px;margin:0">${esc(DOC_LABEL[d.kind])} ${esc(d.no)}</h2>${status}</div>${editable?'<p style="font-size:12px;color:#64748b;margin:0 0 6px">Fields marked * are required. Parts marked automatically were filled in from the record: check them before you finalise.</p>':''}${pdoc}</div>`;
  if(editable){d._fields=fields;window._docFields=fields;window._docCollect=collect}
}
function docSave(id){run(async()=>{await api('documents/save',{id,data:window._docCollect?window._docCollect():{}});toast('Draft saved','ok')})}
function docFinal(id){if(!confirm('Finalise this document? After this it cannot be changed; you will amend it instead.'))return;run(async()=>{await api('documents/finalize',{id,data:window._docCollect?window._docCollect():{}});toast('Document finalised','ok');render()})}
function docAmend(id){if(!confirm('Create a corrected copy? The original stays on file and is marked superseded once the copy is finalised.'))return;run(async()=>{const r=await api('documents/amend',{id});location.hash='#document/'+r.id})}
function docDel(id){if(confirm('Delete this draft?'))run(async()=>{await api('documents/delete',{id});location.hash='#documents'})}

/* ---------- report centre ---------- */
const REPORT_BLURB={diagnoses:'What patients were diagnosed with, by number, gender, age and department.',activity:'Patients, visits, appointments, admissions, stay length and returning patients.',revenue:'Money billed and collected, who paid (patient or HMO), by method, department and cashier.',services:'What was billed: consultations, laboratory, imaging, pharmacy and wards.',investigations:'Laboratory and imaging: volumes, turnaround times, what is waiting now.',inventory:'Stock on hand, value, what was received and dispensed, and the reorder list.',hmo:'HMO verifications, authorisations, claims, amounts owed and rejected bills.',quality:'Incidents by type, severity, department and status, and resolution times.',staff:'What each doctor, scientist, pharmacist and cashier handled.',departments:'Staffing, visits, billing and incidents for each department and unit.'};
const REPORT_ICON={diagnoses:'reports',activity:'patients',revenue:'billing',services:'billing',investigations:'lab',inventory:'pharmacy',hmo:'hmo',quality:'incidents',staff:'staff',departments:'departments'};
async function pReportCentre(){
  const list=await api('reportc/list');const first=(location.hash.split('/')[1])||list[0].type;
  let h=head('Report centre');
  h+=`<div class="pa" style="margin-bottom:8px">${list.map(r=>`<button class="btn ghost sm rc-tab${r.type===first?' on':''}" data-r="${r.type}">${ic(REPORT_ICON[r.type]||'reports')} ${esc(r.title)}</button>`).join('')}</div>`;
  h+=`<div class="panel"><div class="pa" style="align-items:flex-end"><label>From<input type="date" id="rc_f" value="${new Date(Date.now()-29*864e5).toISOString().slice(0,10)}"></label><label>To<input type="date" id="rc_t" value="${todayStr()}"></label><div class="pa"><button class="btn sm ghost" onclick="rcPreset(7)">Last 7 days</button><button class="btn sm ghost" onclick="rcPreset(30)">Last 30 days</button><button class="btn sm ghost" onclick="rcPreset(365)">Last year</button></div><button class="btn" onclick="rcRun()">Show report</button></div><p id="rc_blurb" style="font-size:13px;color:#475569;margin:10px 0 0"></p></div><div id="rc_out"></div>`;
  pg().innerHTML=h; window._rcType=first;
  document.querySelectorAll('.rc-tab').forEach(b=>b.onclick=()=>{window._rcType=b.dataset.r;document.querySelectorAll('.rc-tab').forEach(x=>x.classList.toggle('on',x===b));rcRun()});
  rcRun();
}
function rcPreset(days){const t=new Date();const f=new Date(Date.now()-(days-1)*864e5);$('#rc_f').value=f.toISOString().slice(0,10);$('#rc_t').value=t.toISOString().slice(0,10);rcRun()}
function rcRun(){run(async()=>{const t=window._rcType;$('#rc_blurb').textContent=REPORT_BLURB[t]||'';
  const r=await api(`reportc?type=${t}&from=${v('rc_f')}&to=${v('rc_t')}`);window._rcData=r;
  const kpis=`<div class="kcards rc-cards" style="margin-top:12px">${r.kpis.map(k=>`<div class="kc"><div class="n">${kfmt(k)}</div><div class="l">${esc(k.label)}</div></div>`).join('')}</div>`;
  const charts=`<div class="charts">${r.charts.map(chartHtml).join('')}</div>`;
  const tables=r.tables.map((tb,i)=>`<div class="panel"><div class="pa" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0">${esc(tb.title)}</h3><button class="btn sm ghost" onclick="exportTable(${JSON.stringify(r.title+' - '+tb.title).replace(/"/g,'&quot;')},${JSON.stringify(tb.columns).replace(/"/g,'&quot;')},${JSON.stringify(tb.rows).replace(/"/g,'&quot;')})">${ic('export')} Export this table</button></div>${tableWrap(table(tb.columns.map((c_,ci)=>({h:esc(c_.h),f:rw=>{const x=rw[ci];return c_.t==='money'?fmt(x):c_.t==='pct'?(x+'%'):c_.t==='hours'?(x+' h'):(typeof x==='number'?fmtN(x):esc(x))}})),tb.rows.map(rw=>rw),'No rows for this period'))}</div>`).join('');
  $('#rc_out').innerHTML=`<h2 style="font-size:17px;margin:14px 0 0">${esc(r.title)} <small style="color:#64748b;font-weight:400">${esc(r.from)} to ${esc(r.to)}</small></h2>`+kpis+charts+(r.note?`<p style="font-size:12px;color:#64748b">${esc(r.note)}</p>`:'')+tables+`<div class="pa">${exportButtons('__report__',r.title,false).replace("exportPick('__report__'","exportReport('"+t+"'")}</div>`;
})}
function exportReport(t){const r=window._rcData;run(async()=>{const cols=r.tables.map(x=>x);let rows_=[];let headers=[];cols.forEach(tb=>{headers=tb.columns.map(c=>c.h);tb.rows.forEach(rw=>rows_.push(rw));rows_.push(tb.columns.map(()=>''));});
  window._exp={title:r.title+' ('+r.from+' to '+r.to+')',cols:r.tables[0].columns,rows:r.tables[0].rows};exportTable(window._exp.title,r.tables[0].columns,r.tables[0].rows)})}

/* ---------- import and export ---------- */
async function pData(){
  const [imp,ex]=await Promise.all([api('import/info'),api('export/list')]);
  let h=head('Import and export data',ex.can_all?`<button class="btn ghost" onclick="exportAll()">${ic('export')} Export everything (ZIP)</button>`:'');
  h+=`<div class="panel"><h3>Import from a spreadsheet (CSV)</h3><p style="font-size:13px;margin:0 0 8px">Save your Excel sheet as <b>CSV (Comma delimited)</b>, then choose the type below. Download the template first: it has the exact column names and example rows. Rows with problems are reported with their line number and the rest still import. Start with a <b>Test (dry run)</b>, which checks everything without saving.</p>
  ${imp.length?`<div class="ph-cards">${imp.map(i=>`<div class="pq-card" style="flex-direction:column;align-items:stretch"><b>${esc(i.title)}</b><div style="font-size:12px;color:#64748b">${i.cols.filter(c=>c.req).length} required column(s)</div><div class="acts"><button class="btn sm ghost" onclick="importTemplate('${i.what}')">${ic('export')} Template</button><button class="btn sm" onclick="importForm2('${i.what}')">${ic('import')} Import</button></div></div>`).join('')}</div>`:'<div class="warn">Your role cannot import data. Ask the administrator.</div>'}</div>`;
  h+=`<div class="panel"><h3>Export</h3><p style="font-size:13px;margin:0 0 8px">Export any list as CSV (opens in Excel), Excel (.xlsx), JSON, PDF or HTML. Lists with dates let you choose the period.</p>
  <div class="ph-cards">${ex.datasets.map(d=>`<div class="pq-card" style="flex-direction:column;align-items:stretch"><b>${esc(d.title)}</b><div class="acts"><button class="btn sm ghost" onclick="exportPick('${d.what}','${esc(d.title)}',${d.dated?1:0})">${ic('export')} Export</button></div></div>`).join('')}</div></div>`;
  pg().innerHTML=h;
}
function importTemplate(what){run(async()=>{const r=await fetch('/api/import/template?what='+what);if(!r.ok){toast('Could not get the template','err');return}const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='import_template_'+what+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)})}
function exportAll(){run(async()=>{const r=await fetch('/api/export?what=all&format=csv');if(!r.ok){let m='Could not export';try{m=(await r.json()).error}catch(e){}toast(m,'err');return}const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='okv_hms_all_data_'+todayStr()+'.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)})}
function importForm2(what){run(async()=>{const info=(await api('import/info')).find(i=>i.what===what);if(!info)return toast('Your role cannot import this','err');
  const cols=info.cols.map(c=>`<tr><td><code>${esc(c.k)}</code></td><td>${c.req?'<b>Required</b>':'Optional'}</td><td style="font-size:12px">${esc(c.desc)}</td></tr>`).join('');
  modal('Import: '+info.title,`<div class="pa" style="margin-bottom:8px"><button class="btn sm ghost" onclick="importTemplate('${what}')">${ic('export')} Download template</button></div><details open style="margin-bottom:8px"><summary style="cursor:pointer;font-weight:600">How to fill the file</summary><ol style="font-size:13px;line-height:1.7;padding-left:18px;margin:6px 0"><li>Download the template and open it in Excel.</li><li>Keep the first row (column names) exactly as it is. Delete the example rows and type your data.</li><li>Save as <b>CSV (Comma delimited)</b>. Do not save as .xlsx.</li><li>Choose the file below, press <b>Test</b> first and fix any listed rows, then press <b>Import</b>.</li></ol>${info.notes.map(n=>`<p style="font-size:12px;color:#475569;margin:4px 0">${esc(n)}</p>`).join('')}</details>
   <div style="max-height:200px;overflow:auto;margin-bottom:10px"><table><thead><tr><th>Column</th><th>Need</th><th>What to write</th></tr></thead><tbody>${cols}</tbody></table></div>
   <label>CSV file<input type="file" id="imp_file" accept=".csv,text/csv"></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="imp_upd" style="width:auto;margin:0"> Update existing records that match (otherwise they are skipped)</label><div id="imp_out" style="margin-top:8px"></div>`,
   async()=>{const r=await importRun(what,false);toast(`Imported: ${r.created} new, ${r.updated} updated, ${r.skipped} skipped${r.error_count?', '+r.error_count+' with errors':''}`,r.error_count===0);if(r.error_count===0)closeModal()},'Import',true);
  const btn=document.createElement('button');btn.className='btn ghost';btn.id='imp_test';btn.textContent='Test (no changes saved)';btn.onclick=()=>run(async()=>{const r=await importRun(what,true);renderImportResult(r)});document.querySelector('#modal .mf').insertBefore(btn,$('#mok'));
})}
async function importRun(what,dry){const f=document.getElementById('imp_file').files[0];if(!f)throw new Error('Choose a CSV file first');if(f.size>3*1024*1024)throw new Error('File too large (3 MB maximum)');
  const text=await f.text();const r=await api('import/run',{what,csv:text,dry_run:dry,update:document.getElementById('imp_upd').checked});renderImportResult(r);return r}
function renderImportResult(r){const el=document.getElementById('imp_out');if(!el)return;
  const cls=r.error_count?'warn':'trialnote';
  const head_=(r.dry_run?'Test result (nothing saved): ':'')+r.total+' row(s): '+r.created+' would be created, '+r.updated+' updated, '+r.skipped+' skipped'+(r.error_count?', '+r.error_count+' with errors':'')+'.';
  const ign=(r.ignored_columns&&r.ignored_columns.length)?' Ignored columns: '+esc(r.ignored_columns.join(', ')):'';
  const errs=(r.errors||[]).slice(0,50).map(e=>'<div>Line '+e.line+': '+esc(e.error)+'</div>').join('');
  el.innerHTML='<div class="'+cls+'">'+esc(head_)+ign+'</div>'+(r.errors.length?'<div style="max-height:180px;overflow:auto;font-size:12px;border:1px solid #fecaca;border-radius:8px;padding:6px">'+errs+(r.errors.length>50?'<div>...and more</div>':'')+'</div>':'');
}


/* ---------- branding: logo, brand colour and printed details ---------- */
function shade(hex,f){const n=parseInt(hex.slice(1),16);return '#'+[(n>>16)&255,(n>>8)&255,n&255].map(x=>Math.round(x*f).toString(16).padStart(2,'0')).join('')}
function applyTheme(hex){if(!/^#[0-9a-f]{6}$/i.test(hex||''))return;const st=document.documentElement.style;st.setProperty('--p',hex);st.setProperty('--p2',shade(hex,0.72))}
function brandHtml(){return ME&&ME.has_logo?`<img class="logo-img" src="/api/logo?v=${esc(ME.logo_v||'')}" alt="${esc(SET.hospital_name)}"><span>${esc(SET.hospital_name)}</span>`:esc(SET.hospital_name)}


/* ---------- nurse shifts and duty routing (optional) ---------- */
const dtLocal=(s_)=>s_?String(s_).replace(' ','T').slice(0,16):'';
async function pShifts(){
  if(ME.role==='nurse')return pNurseShifts();
  const [on,list,wards,deps,cur]=await Promise.all([api('shifts/on-duty'),api('shifts'),api('wards'),api('departments'),api('settings')]);
  window._shifts=list;window._shwards=wards;window._shdeps=deps;
  const nowT=on.now||'';
  const onHtml=on.shifts.length?on.shifts.map(x=>`<div class="pq-card" style="flex-direction:column;align-items:stretch"><b>${esc(x.nurse)}</b><span style="font-size:12px;color:#64748b">${x.scope==='ward'?'Ward':'Department'}: ${esc(x.place)}</span><span style="font-size:12px">Until ${esc(x.ends)}</span></div>`).join(''):'<div class="empty" style="grid-column:1/-1">Nobody is on duty right now.</div>';
  const rows_=list.map(x=>[x.starts,x.ends,esc(x.nurse),x.scope==='ward'?'Ward':'Department',esc(x.place),esc(x.note||''),x.ends<=nowT?'<span class="tag">finished</span>':x.starts<=nowT?'<span class="tag g">on duty</span>':'<span class="tag b">to come</span>',
    acts(ib('edit','Edit shift',`shiftForm(${x.id})`),ib('trash','Delete shift',`shiftDel(${x.id})`,'red'))]);
  pg().innerHTML=head('Shifts and duty',`<button class="btn" onclick="shiftForm()">${ic('plus')} Add shift</button>`+exportButtons('shifts','Shifts',false))+
  `<div class="panel"><div class="pa" style="justify-content:space-between;align-items:center"><div><h3 style="margin:0">Route patients to the nurse on duty</h3><p style="font-size:13px;margin:4px 0 0">When this is on, a new admission, visit or check-in is given the nurse rostered for that ward or department at that moment. When it is off, nothing is automatic and nurses are assigned by hand. Turning it off changes nothing already assigned.</p></div><div class="pa"><label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" id="rt_on" style="width:auto;margin:0" ${on.routing?'checked':''}> Route automatically</label><button class="btn sm" onclick="saveRouting()">Save</button></div></div></div>`+
  `<div class="panel"><h3>On duty now</h3><div class="ph-cards">${onHtml}</div></div>`+
  `<div class="panel"><h3>Roster (yesterday to next six days)</h3>${tableWrap(table([{h:'Starts',f:r=>esc(r[0])},{h:'Ends',f:r=>esc(r[1])},{h:'Nurse',f:r=>r[2]},{h:'Type',f:r=>r[3]},{h:'Ward or department',f:r=>r[4]},{h:'Note',f:r=>r[5]},{h:'Status',f:r=>r[6]},{h:'',f:r=>r[7]}],rows_,'No shifts rostered in this period. Add one to start.'))}</div>`;
  pageKpis('shifts');
}
async function saveRouting(){run(async()=>{const on=document.getElementById('rt_on').checked;const cur=await api('settings');await api('settings',Object.assign({},cur,{shift_routing:on?'1':'0'}));SET.shift_routing=on?'1':'0';toast(on?'Patients will be routed to the nurse on duty':'Automatic routing is off','ok');pShifts()})}
function shiftForm(id){run(async()=>{const sh=id?(window._shifts||[]).find(x=>x.id===id):null;const nurses=(await api('users')).filter(u=>u.role==='nurse'&&u.active);
  const today_=todayStr();
  modal(sh?'Edit shift':'Add shift',fld('sh_n','Nurse',sh?sh.nurse_id:'',null,nurses.map(n=>[n.id,n.name]))+
    `<div class="grid2">${fld('sh_s','Covers a',sh?sh.scope:'ward',null,[['ward','Ward'],['department','Department or unit']])}<label>Which one<select id="sh_t"></select></label></div>`+
    `<div class="grid2">${fld('sh_a','Starts','','datetime-local')}${fld('sh_e','Ends','','datetime-local')}</div>`+fld('sh_no','Note (optional)',sh?sh.note:''),
    async()=>{await api('shifts/save',{id:sh?sh.id:0,nurse_id:v('sh_n'),scope:v('sh_s'),target_id:v('sh_t'),starts:v('sh_a'),ends:v('sh_e'),note:v('sh_no')});closeModal();toast('Shift saved','ok');pShifts()},'Save shift');
  if(sh){document.getElementById('sh_a').value=dtLocal(sh.starts);document.getElementById('sh_e').value=dtLocal(sh.ends)}
  else{document.getElementById('sh_a').value=today_+'T07:00';document.getElementById('sh_e').value=today_+'T19:00'}
  const fill=()=>{const sc=v('sh_s');const list=sc==='ward'?(window._shwards||[]):(window._shdeps||[]);document.getElementById('sh_t').innerHTML=list.map(x=>`<option value="${x.id}"${sh&&sh.scope===sc&&sh.target_id===x.id?' selected':''}>${esc(x.name)}</option>`).join('')};
  document.getElementById('sh_s').onchange=fill;fill();
})}
function shiftDel(id){if(confirm('Delete this shift? Patients already given to this nurse keep them.'))run(async()=>{await api('shifts/delete',{id});toast('Shift deleted','ok');pShifts()})}

async function pNurseShifts(){

/* ---------- internal messages ---------- */
async function pMessages(){
  pg().innerHTML=head('Messages',`<button class="btn ghost" onclick="api('messages/read',{all:true}).then(()=>{ME.unread=0;setBadge(0);pMessages()})">Mark all read</button><button class="btn" onclick="composeTo()">+ New message</button>`)+`<div class="tabs"><button class="on" data-s="inbox">Inbox</button><button data-s="sent">Sent</button></div><div class="panel" id="ml"></div>`;
  let box='inbox';const load=()=>run(async()=>{const l=await api('messages?box='+box);window._msgs=l;
    $('#ml').innerHTML=table([{h:box==='sent'?'To':'From',f:r=>esc(r.other)+(r.broadcast?' <span class="tag b">everyone</span>':'')},{h:'Subject',f:r=>esc(r.subject||'(no subject)')},{h:'Message',f:r=>esc((r.body||'').slice(0,70))+((r.body||'').length>70?'...':'')},{h:'When',f:r=>dt(r.created)},
      {h:'Actions',f:r=>acts(ib('eye','Read message',`readMsg(${r.id},'${box}')`),box==='inbox'?ib('reply','Reply',`replyMsg(${r.id})`,'gn'):'',ib('trash','Delete',`delMsg(${r.id})`,'red'))}],l,box==='sent'?'You have not sent any messages':'Your inbox is empty').replace(/<tr>/g,'<tr>')
    document.querySelectorAll('#ml tbody tr').forEach((tr,i)=>{if(box==='inbox'&&!l[i].read)tr.classList.add('unread')})});
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{box=b.dataset.s;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));load()});
  window._mload=load;load();
}
function readMsg(id,box){const m=window._msgs.find(x=>x.id===id);if(!m)return;
  modal(m.subject||'(no subject)',`<p style="font-size:12px;color:#64748b">${box==='sent'?'To':'From'}: <b>${esc(m.other)}</b> &middot; ${dt(m.created)}</p><div style="white-space:pre-wrap;background:#f8fafc;border-radius:8px;padding:12px">${esc(m.body)}</div>`,null);
  if(box==='inbox'&&!m.read){run(async()=>{await api('messages/read',{id});m.read=1;ME.unread=Math.max(0,(ME.unread||0)-1);setBadge(ME.unread);window._mload&&window._mload()})}}
function replyMsg(id){const m=window._msgs.find(x=>x.id===id);const u=m&&(window._dir||[]);composeTo(null,m.subject?'Re: '+m.subject:'',m.other)}
function delMsg(id){if(confirm('Delete this message from your list?'))run(async()=>{await api('messages/delete',{id});const m=window._msgs.find(x=>x.id===id);if(m&&!m.read){ME.unread=Math.max(0,(ME.unread||0)-1);setBadge(ME.unread)}window._mload?window._mload():0})}
async function composeTo(uid,subject,byName){
  const dir=await api('directory');window._dir=dir;
  let sel=uid||'';if(!sel&&byName){const f=dir.find(x=>x.name===byName);if(f)sel=f.id}
  modal('New message',fld('mt_to','To',sel||'all',null,[['all','Everyone (all staff)']].concat(dir.map(x=>[x.id,x.name+' ('+ROLE_LABEL[x.role]+')'])))+fld('mt_s','Subject',subject||'')+fld('mt_b','Message','','textarea'),async()=>{
    const to=v('mt_to');const r=await api('messages/send',{to:to==='all'?'all':+to,subject:v('mt_s'),body:v('mt_b')});closeModal();toast('Message sent to '+r.sent+' '+(r.sent===1?'person':'people'),'ok');if(location.hash==='#messages'&&window._mload)window._mload()},'Send')}

    await api('users/save',{id,name:v('sn'),username:v('su'),password:document.getElementById('sp')?document.getElementById('sp').value:undefined,role:v('sr'),active:+v('sa')});closeModal();toast('Saved','ok');loadStaff()})}
function resetForm(id){const own=id===ME.id;modal(own?'Reset my password':'Reset password',(own?'':'<p style="font-size:13px">Type a new password and tell the person. They must change it the next time they sign in.</p>')+fld('rp','New password (min 6 characters)','','password')+fld('rp2','Repeat new password','','password'),async()=>{if(document.getElementById('rp').value!==document.getElementById('rp2').value)throw new Error('The passwords do not match');await api('users/reset',{id,password:document.getElementById('rp').value});closeModal();toast(own?'Your password was changed':'Password reset. The user must change it at next login.','ok');loadStaff()})}
function importForm(){modal('Import staff from CSV',`<p style="font-size:12px;color:#64748b">One person per line: username,name,role,password<br>Roles: ${Object.keys(ROLE_LABEL).join(', ')}</p>`+fld('ic','CSV text','','textarea'),async()=>{const r=await api('users/import',{csv:document.getElementById('ic').value});closeModal();toast(r.created+' created'+(r.skipped.length?', '+r.skipped.length+' skipped: '+r.skipped.slice(0,3).join('; '):''),r.skipped.length?'err':'ok');loadStaff()},'Import')}

function startPanel(s){return `<div class="panel" style="max-width:640px"><h3>Start and run</h3><p style="font-size:13px;margin:0 0 8px">OKV HMS keeps running in the background when you close the browser, so other computers and phones can keep using it. You can stop it at any time from Settings below.</p><label style="display:flex;gap:8px;align-items:center;margin:0 0 8px"><input type="checkbox" id="as_on" style="width:auto;margin:0" ${s.autostart==='1'?'checked':''}> Start OKV HMS automatically when Windows starts (installed Windows version)</label><button class="btn sm" onclick="saveAutostart()">Save</button> <span style="font-size:12px;color:#64748b">Only the administrator can change this.</span></div>`}
function saveAutostart(){run(async()=>{const on=document.getElementById('as_on').checked;const r=await api('system/autostart',{on:on?'1':'0'});SET.autostart=on?'1':'0';toast(on?'OKV HMS will start with Windows':'Start with Windows is off','ok');pSettings()})}
function brandPanel(s){return `<div class="panel" style="max-width:640px"><h3>Logo, colours and printed details</h3><p style="font-size:13px;margin:0 0 8px">Your logo and brand colour appear on the sign-in page, the menu and every printout: receipts, invoices, prescriptions, reports and documents.</p><div class="pa" style="align-items:center;margin-bottom:10px"><div style="width:190px;height:96px;border:1px dashed #cbd5e1;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#f8fafc">${ME.has_logo?`<img src="/api/logo?v=${esc(ME.logo_v||'')}" style="max-width:176px;max-height:86px" alt="Your logo">`:'<span style="color:#94a3b8;font-size:12px">No logo yet</span>'}</div><div style="min-width:200px"><input type="file" id="logofile" accept="image/png,image/jpeg"><div style="font-size:11px;color:#64748b;margin:4px 0">PNG or JPG, under 400 KB. A wide image works best.</div><div class="pa"><button class="btn sm" onclick="saveLogo()">Upload logo</button>${ME.has_logo?'<button class="btn sm ghost" onclick="removeLogo()">Remove logo</button>':''}</div></div></div>${fld('b_tag','Tagline (printed under the name)',s.tagline)}<div class="grid2">${fld('b_reg','Registration number',s.reg_no)}${fld('b_web','Website',s.website)}</div><label>Brand colour<input type="color" id="b_col" value="${esc(s.theme_color||'#0f766e')}" style="height:38px;width:96px;padding:2px"></label>${fld('b_terms','Invoice terms (printed on every invoice)',s.invoice_terms,'textarea')}<button class="btn" onclick="saveBranding()">Save branding</button></div>`}
function saveLogo(){run(async()=>{const f=document.getElementById('logofile').files[0];if(!f)throw new Error('Choose an image first');if(f.size>400*1024)throw new Error('The logo is larger than 400 KB. Use a smaller image.');await api('settings/logo',{data:await fileToDataUrl(f)});const d=await api('me');ME.has_logo=d.has_logo;ME.logo_v=d.logo_v;$('.brand').innerHTML=brandHtml();toast('Logo saved','ok');pSettings()})}
function removeLogo(){if(!confirm('Remove the logo? The hospital name will be shown instead.'))return;run(async()=>{await api('settings/logo/remove',{});const d=await api('me');ME.has_logo=d.has_logo;ME.logo_v=d.logo_v;$('.brand').innerHTML=brandHtml();toast('Logo removed','ok');pSettings()})}
function saveBranding(){run(async()=>{const col=v('b_col');if(!/^#[0-9a-f]{6}$/i.test(col))throw new Error('Choose a brand colour');const cur=await api('settings');const body=Object.assign({},cur,{tagline:v('b_tag'),reg_no:v('b_reg'),website:v('b_web'),theme_color:col,invoice_terms:v('b_terms')});await api('settings',body);SET=Object.assign({},SET,body);applyTheme(col);$('.brand').innerHTML=brandHtml();toast('Branding saved','ok')})}

async function pSettings(){
  const s=await api('settings');
  pg().innerHTML=head('Settings')+startPanel(s)+brandPanel(s)+`<div class="panel" style="max-width:640px">${fld('s_hospital_name','Hospital name',s.hospital_name)}${fld('s_address','Address',s.address)}<div class="grid2">${fld('s_phone','Phone',s.phone)}${fld('s_email','Email',s.email)}${fld('s_currency','Currency symbol',s.currency)}${fld('s_consultation_fee','Consultation fee',s.consultation_fee,'number')}${fld('s_pid_prefix','Patient ID prefix',s.pid_prefix)}${fld('s_inv_prefix','Invoice prefix',s.inv_prefix)}</div>${fld('s_footer','Footer line on printouts',s.footer)}<button class="btn" onclick="saveSettings()">Save settings</button></div><div class="panel" style="max-width:640px"><h3>Phones and tablets</h3><p>Let staff use the system on phones and tablets over the same Wi-Fi.</p><button class="btn ghost" onclick="phoneAccess()">Show address and QR code</button></div><div class="panel" style="max-width:640px"><h3>Stop the system</h3><p>OKV HMS runs quietly in the background on this computer. Stop it here when you want to switch the server off properly. Start it again from the OKV HMS icon.</p><button class="btn red" onclick="stopSystem()">Stop the system</button></div><div class="panel" style="max-width:640px"><h3>Backup</h3><p>Download a copy of all hospital data. Keep backups on a flash drive or another computer.</p><a class="btn" href="/api/backup">Download backup</a></div>`;
}
function stopSystem(){if(!confirm('Stop OKV HMS? Everyone using it will be disconnected. Start it again from the OKV HMS icon.'))return;run(async()=>{await api('shutdown',{});clearInterval(window._poll);document.body.innerHTML='<div style="max-width:480px;margin:18vh auto;font-family:system-ui;text-align:center;padding:20px"><h2>OKV HMS has stopped</h2><p>To start it again, open the <b>OKV HMS</b> icon on this computer.</p></div>'})}
function saveSettings(){run(async()=>{const b={};['hospital_name','address','phone','email','currency','consultation_fee','pid_prefix','inv_prefix','footer'].forEach(k=>b[k]=v('s_'+k));
  await api('settings',b);const d=await api('me');SET=d.settings;document.title=SET.hospital_name;$('.brand').innerHTML=brandHtml();toast('Settings saved','ok')})}

boot();
</script><script>
(function(){
  var LOCKED_PAGES = ['settings','license','staff','data','audit'];
  var CTA = '<div class="wcta"><span><b>Available in the full version.</b> These fields are disabled in the demo. Buy the full version to change them.</span>'
          + '<span><a href="pricing.html">Buy the full version</a> <a class="alt" href="../okvhms/index.html">Get started</a></span></div>';
  function currentPage(){ return (location.hash || '#dashboard').replace('#','').split('/')[0]; }
  function apply(){
    var page = currentPage(), locked = LOCKED_PAGES.indexOf(page) >= 0, root = document.getElementById('pg');
    document.querySelectorAll('input[type=password]').forEach(function(e){ e.disabled = true; });
    if (root) {
      // change the page only when needed: inserting or removing boxes here must not trigger this again
      var has = root.querySelector('.wcta');
      if (locked) {
        root.querySelectorAll('input,select,textarea').forEach(function(e){ if(!e.disabled) e.disabled = true; });
        if (!has) root.insertAdjacentHTML('afterbegin', CTA);
      } else if (has) {
        has.parentNode.removeChild(has);
      }
    }
    document.querySelectorAll('.ov input, .ov select, .ov textarea').forEach(function(e){
      var key = ((e.id || '') + ' ' + (e.name || '')).toLowerCase();
      if (/pw|pass|secret|code|key|licen|activ|reset|recovery/.test(key)) e.disabled = true;
    });
  }
  window.addEventListener('hashchange', apply);
  document.addEventListener('DOMContentLoaded', function(){
    document.body.insertAdjacentHTML('afterbegin', '<div id="wbar"><span><b>OKV Hospital Management System</b> <span class="dt">&middot; Demo with sample data</span></span><span><a href="../index.html">Home</a> <a class="go" href="../okvhms/index.html">Get started</a></span></div>');
    var busy = false;
    new MutationObserver(function(){ if (busy) return; busy = true; try { apply(); } finally { busy = false; } }).observe(document.body, {childList:true, subtree:true});
    apply();
  });
})();
</script></body></html>
